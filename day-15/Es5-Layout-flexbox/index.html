
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Flexbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <h2>MyDashboard</h2>

      <nav>
        <a href="#">🏠 Dashboard</a>
        <a href="#">📊 Analytics</a>
        <a href="#">👥 Users</a>
        <a href="#">⚙️ Settings</a>
      </nav>
    </aside>

    <!-- MAIN -->
    <main class="main">

      <!-- TOPBAR -->
      <header class="topbar">
        <input type="text" placeholder="Cerca...">
        <div class="avatar">MR</div>
      </header>

      <!-- CONTENT -->
      <section class="content">

        <h1>Dashboard Overview</h1>

        <div class="stats">

          <div class="stat-card">
            <h3>Revenue</h3>
            <p>€12.450</p>
          </div>

          <div class="stat-card">
            <h3>Users</h3>
            <p>1.240</p>
          </div>

          <div class="stat-card">
            <h3>Orders</h3>
            <p>385</p>
          </div>

          <div class="stat-card">
            <h3>Growth</h3>
            <p>+18%</p>
          </div>

        </div>

      </section>
    </main>

  </div>

</body>
</html>
