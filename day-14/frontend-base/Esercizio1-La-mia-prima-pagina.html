
<!DOCTYPE html>
<!-- Il doctype indica al browser che il documento usa HTML5. -->
<html lang="it">
<head>
    <!-- Definisce la codifica dei caratteri: permette di usare lettere accentate. -->
    <meta charset="UTF-8">
    <!-- Rende la pagina responsive adattando la larghezza allo schermo del dispositivo. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Testo mostrato nella scheda del browser. -->
    <title>La mia prima pagina HTML</title>
</head>
<body>
    <!-- Titolo principale della pagina. -->
    <h1>Ciao Mondo!</h1>
    <!-- Paragrafo con il messaggio di benvenuto. -->
    <p>Benvenuto nella mia prima pagina web!</p>
</body>
</html>
