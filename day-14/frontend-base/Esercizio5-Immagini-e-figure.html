<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galleria fotografica</title>
</head>
<body>

<h1>Galleria fotografica</h1>

<!-- figure raggruppa un'immagine e la relativa descrizione. -->
<figure>
    <!-- src indica il percorso dell'immagine e alt ne descrive il contenuto. -->
    <img src="https://picsum.photos/id/237/200/300"
    alt = "Cucciolo di cane">
    <!-- figcaption fornisce la didascalia associata alla figura. -->
    <figcaption>Cucciolo di cane</figcaption>

</figure>

<figure>
    <img src="https://picsum.photos/id/237/200/300"
    alt = "Cucciolo di cane">
    <figcaption>Cucciolo di cane</figcaption>

</figure>

  <figure>
    <img src="https://picsum.photos/id/237/200/300"
    alt = "Cucciolo di cane">
    <figcaption>Cucciolo di cane</figcaption>

</figure>

    
</body>
</html>
